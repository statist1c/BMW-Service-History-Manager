name: Build signed Android APK manually
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version for the APK (v0.2.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          (( major < 2000 && minor < 1000 && patch < 1000 )) || exit 1
          echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "APP_CODE=$((major*1000000+minor*1000+patch))" >> "$GITHUB_ENV"
      - name: Core protocol checks
        run: |
          mkdir -p work/test-classes
          javac -d work/test-classes app/src/main/java/dev/mgu/service/ServiceRecord.java app/src/main/java/dev/mgu/service/Hsfz.java app/src/main/java/dev/mgu/service/Cbs.java app/src/main/java/dev/mgu/service/HeadUnitInfo.java app/src/main/java/dev/mgu/service/HeadUnitProtocol.java tests/CoreTest.java tests/FeatureTest.java
          java -cp work/test-classes dev.mgu.service.CoreTest
          java -cp work/test-classes dev.mgu.service.FeatureTest
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Build and lint
        env:
          BMW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle assembleRelease lintRelease -PreleaseKeystore="$RUNNER_TEMP/release.jks" -PappVersionName="$APP_VERSION" -PappVersionCode="$APP_CODE" --console=plain
      - name: Package release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/BMW-Service-Manager-${RELEASE_TAG}.apk"
          git archive --format=zip -o release/BMW-Service-Manager-source.zip HEAD
          cd release
          sha256sum "BMW-Service-Manager-${RELEASE_TAG}.apk" BMW-Service-Manager-source.zip > SHA256SUMS.txt
      - name: Save files for manual release upload
        uses: actions/upload-artifact@v4
        with:
          name: BMW-Service-Manager-${{ inputs.release_tag }}
          path: release/
      - name: Remove private runner key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
