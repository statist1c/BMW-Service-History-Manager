plugins { id 'com.android.application' }
android {
 namespace 'dev.mgu.service'
 compileSdk 35
 defaultConfig {
  applicationId 'dev.mgu.service'
  minSdk 26
  targetSdk 35
  versionCode = (project.findProperty('appVersionCode') ?: '2002').toInteger()
  versionName = (project.findProperty('appVersionName') ?: '0.2.2')
  testInstrumentationRunner 'dev.mgu.service.AppSmokeTest'
  buildConfigField 'String', 'UPDATE_REPOSITORY', '"statist1c/BMW-Service-History-Manager"'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 signingConfigs {
  release {
   if (project.hasProperty('releaseKeystore')) {
    storeFile file(project.property('releaseKeystore'))
    storePassword System.getenv('BMW_KEYSTORE_PASSWORD')
    keyAlias 'bmw-service'
    keyPassword System.getenv('BMW_KEYSTORE_PASSWORD')
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release } }
}
